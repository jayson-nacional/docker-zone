services:
  php_workspace:
    container_name: php_workspace
    stdin_open: true
    tty: true
    build:
      args:
        CONTAINER_USER: "${DOCKER_USER}"
      dockerfile: ./workspace/php.dockerfile.dev
    image: php_workspace
    volumes:
      - "${HOME}/.ssh:/home/${DOCKER_USER}/.ssh:ro"
      - "${HOME}/projects:/home/${DOCKER_USER}/development:rw"
      - "${HOME}/docker/nvim/data:/home/${DOCKER_USER}/.local/share/nvim:rw"
      - "${HOME}/docker/nvim/state:/home/${DOCKER_USER}/.local/state/nvim:rw"
    networks:
      - docker_network  

  php_fpm:
    container_name: php_fpm
    build:
      dockerfile: ./fpm/php-fpm.dockerfile.dev
    image: php_fpm
    volumes:
      - "${HOME}/projects:/var/www/html:ro"
    networks:
      - docker_network

  php_nginx:
    container_name: php_nginx
    build:
      dockerfile: ./nginx/nginx.dockerfile.dev
    image: php_nginx
    volumes:
      - "${HOME}/projects:/var/www/html:ro"
    ports:
      - 6060:80
    networks:
      - docker_network
    depends_on:
      - php_fpm

networks:
  docker_network:
    name: docker_network
    driver: bridge
