services:
  dotnet_workspace:
    container_name: dotnet_workspace
    stdin_open: true
    tty: true
    build:
      args:
        CONTAINER_USER: "${DOCKER_USER}"
      dockerfile: dotnet.dockerfile.dev
    image: dotnet_workspace
    volumes:
      - "${HOME}/.ssh:/home/${DOCKER_USER}/.ssh:ro"
      - "${HOME}/projects:/home/${DOCKER_USER}/development:rw"
      - "${HOME}/docker/nvim/data:/home/${DOCKER_USER}/.local/share/nvim:rw"
      - "${HOME}/docker/nvim/state:/home/${DOCKER_USER}/.local/state/nvim:rw"
    networks:
      - docker_network

networks:
  docker_network:
    name: docker_network
    driver: bridge
